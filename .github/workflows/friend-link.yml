name: Friend Link Automation

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-friend-link:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'friend-link')) ||
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'friend-link') && github.event.comment.body == '/recheck')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract issue data
        id: extract
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          SITE_NAME=$(echo "$BODY" | grep -A1 "### 站点名称" | tail -1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          SITE_URL=$(echo "$BODY" | grep -A1 "### 站点链接" | tail -1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          AVATAR_URL=$(echo "$BODY" | grep -A1 "### 头像/图标链接" | tail -1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          DESCRIPTION=$(echo "$BODY" | grep -A1 "### 站点描述" | tail -1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          TAGS=$(echo "$BODY" | grep -A1 "### 标签" | tail -1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')

          echo "site_name=$SITE_NAME" >> $GITHUB_OUTPUT
          echo "site_url=$SITE_URL" >> $GITHUB_OUTPUT
          echo "avatar_url=$AVATAR_URL" >> $GITHUB_OUTPUT
          echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Validate required fields
        id: validate-fields
        env:
          SITE_NAME: ${{ steps.extract.outputs.site_name }}
          SITE_URL: ${{ steps.extract.outputs.site_url }}
          AVATAR_URL: ${{ steps.extract.outputs.avatar_url }}
          DESCRIPTION: ${{ steps.extract.outputs.description }}
          TAGS: ${{ steps.extract.outputs.tags }}
        run: |
          MISSING=""
          [ -z "$SITE_NAME" ] || [ "$SITE_NAME" = "null" ] && MISSING="$MISSING\n- 站点名称"
          [ -z "$SITE_URL" ] || [ "$SITE_URL" = "null" ] && MISSING="$MISSING\n- 站点链接"
          [ -z "$AVATAR_URL" ] || [ "$AVATAR_URL" = "null" ] && MISSING="$MISSING\n- 头像/图标链接"
          [ -z "$DESCRIPTION" ] || [ "$DESCRIPTION" = "null" ] && MISSING="$MISSING\n- 站点描述"
          [ -z "$TAGS" ] || [ "$TAGS" = "null" ] && MISSING="$MISSING\n- 标签"

          if [ -n "$MISSING" ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            MISSING_MSG=$(echo -e "$MISSING")
            echo "message<<EOF" >> $GITHUB_OUTPUT
            echo "❌ 以下必填字段缺失：$MISSING_MSG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate URLs accessibility
        if: steps.validate-fields.outputs.valid == 'true'
        id: validate-urls
        env:
          SITE_URL: ${{ steps.extract.outputs.site_url }}
          AVATAR_URL: ${{ steps.extract.outputs.avatar_url }}
        run: |
          SITE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -L "$SITE_URL" 2>/dev/null || echo "000")
          echo "Site URL ($SITE_URL) status: $SITE_STATUS"

          AVATAR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -L "$AVATAR_URL" 2>/dev/null || echo "000")
          echo "Avatar URL ($AVATAR_URL) status: $AVATAR_STATUS"

          echo "site_status=$SITE_STATUS" >> $GITHUB_OUTPUT
          echo "avatar_status=$AVATAR_STATUS" >> $GITHUB_OUTPUT

          if [ "$SITE_STATUS" = "000" ]; then
            echo "site_valid=false" >> $GITHUB_OUTPUT
          else
            echo "site_valid=true" >> $GITHUB_OUTPUT
          fi

          if [ "$AVATAR_STATUS" = "000" ]; then
            echo "avatar_valid=false" >> $GITHUB_OUTPUT
          else
            echo "avatar_valid=true" >> $GITHUB_OUTPUT
          fi

      - name: Comment validation result on issue
        uses: actions/github-script@v7
        with:
          script: |
            const siteName = `${{ steps.extract.outputs.site_name }}`;
            const siteUrl = `${{ steps.extract.outputs.site_url }}`;

            let comment = `## 🔄 友链申请处理报告\n\n**站点**: ${siteName} | ${siteUrl}\n\n`;

            const fieldsValid = `${{ steps.validate-fields.outputs.valid }}`;
            if (fieldsValid !== 'true') {
              comment += `### ❌ 字段验证失败\n\n${{ steps.validate-fields.outputs.message }}\n\n`;
              comment += `请编辑 Issue 补充完整信息，然后在评论中输入 \`/recheck\` 重新提交。\n`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.issue_number,
                body: comment
              });
              return;
            }

            const siteValid = `${{ steps.validate-urls.outputs.site_valid }}`;
            const avatarValid = `${{ steps.validate-urls.outputs.avatar_valid }}`;
            const siteStatus = `${{ steps.validate-urls.outputs.site_status }}`;
            const avatarStatus = `${{ steps.validate-urls.outputs.avatar_status }}`;

            comment += `### 📋 验证结果\n\n`;
            comment += `| 检查项 | 状态 | HTTP 状态码 |\n`;
            comment += `|:---|:---:|:---:|\n`;

            if (siteValid === 'true') {
              comment += `| 网站可访问 | ✅ | ${siteStatus} |\n`;
            } else {
              comment += `| 网站可访问 | ❌ | 无法连接 |\n`;
            }

            if (avatarValid === 'true') {
              comment += `| 头像可访问 | ✅ | ${avatarStatus} |\n`;
            } else {
              comment += `| 头像可访问 | ⚠️ | 无法连接 |\n`;
            }

            if (siteValid !== 'true') {
              comment += `\n### ⚠️ 需要修改\n\n`;
              comment += `您的网站无法访问，请检查：\n`;
              comment += `1. 网站是否正常运行\n`;
              comment += `2. URL 地址是否正确\n`;
              comment += `3. 是否有防火墙或访问限制\n\n`;
              comment += `修复后请在评论中输入 \`/recheck\` 重新验证。\n`;

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.issue_number,
                labels: ['friend-link', 'invalid']
              });
            } else {
              comment += `\n⏳ 验证通过，正在创建 PR 添加友链...\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.issue_number,
              body: comment
            });

      - name: Abort if validation failed
        if: steps.validate-fields.outputs.valid != 'true' || steps.validate-urls.outputs.site_valid != 'true'
        run: exit 0

      - name: Add friend link data
        id: add-friend
        env:
          SITE_NAME: ${{ steps.extract.outputs.site_name }}
          SITE_URL: ${{ steps.extract.outputs.site_url }}
          AVATAR_URL: ${{ steps.extract.outputs.avatar_url }}
          DESCRIPTION: ${{ steps.extract.outputs.description }}
          TAGS: ${{ steps.extract.outputs.tags }}
        run: |
          bun run scripts/add-friend.mjs \
            --title="$SITE_NAME" \
            --siteurl="$SITE_URL" \
            --imgurl="$AVATAR_URL" \
            --desc="$DESCRIPTION" \
            --tags="$TAGS"

      - name: Create Pull Request
        id: create-pr
        env:
          SITE_NAME: ${{ steps.extract.outputs.site_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SAFE_NAME=$(echo "$SITE_NAME" | tr -cd '[:alnum:]_-' | tr '[:upper:]' '[:lower:]' | sed 's/^-\|-$//g')
          SAFE_NAME="${SAFE_NAME:-friend}"
          BRANCH_NAME="friend-link/$SAFE_NAME"
          BRANCH_NAME="${BRANCH_NAME:0:80}"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

          git add src/data/friends.ts
          git commit -m "feat(friends): add friend link - $SITE_NAME"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "✨ 添加友链: $SITE_NAME" \
            --body "## 友链申请\n\n**站点名称**: $SITE_NAME\n**站点链接**: ${{ steps.extract.outputs.site_url }}\n**站点描述**: ${{ steps.extract.outputs.description }}\n**标签**: ${{ steps.extract.outputs.tags }}\n\n---\n\n此 PR 由友链申请流程自动创建 (#${{ github.event.issue.number }})\n\n- [x] 数据已添加到 \`src/data/friends.ts\`\n- [x] URL 可用性已验证\n- [ ] 需要管理员审核\n\n请审核该友链信息是否正确。" \
            --label "friend-link" \
            --base "${{ github.event.repository.default_branch }}"

      - name: Update issue with PR link
        uses: actions/github-script@v7
        with:
          script: |
            const siteName = `${{ steps.extract.outputs.site_name }}`;

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${{ github.repository_owner }}:${{ steps.create-pr.outputs.branch_name }}`,
              state: 'open'
            });

            let prLink = '(PR 创建失败，请联系管理员)';
            if (prs.length > 0) {
              prLink = `[#${prs[0].number}](${prs[0].html_url})`;
            }

            const comment = `## ✅ 友链申请已受理\n\n**${siteName}** 的友链申请已通过验证并创建了 Pull Request ${prLink}。\n\n### 后续流程\n1. ⏳ 等待管理员审核 PR\n2. ✅ 审核通过后合并 PR\n3. 🎉 友链将在下次部署后生效\n\n### 请确认\n请检查您是否已在您的网站添加本站的友链。如果还没有，请尽快添加，否则申请可能会被拒绝。`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.issue_number,
              body: comment
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.issue_number,
              labels: ['pr-created']
            });
