name: 友链申请
description: 申请交换友情链接（Friend Link）
title: "[友链] 站点名称"
labels: ["friend-link"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢您申请友情链接交换！

        在提交之前，请确保您已经：
        - ✅ 在您的网站添加了本站的友情链接
        - ✅ 阅读了本站的友链要求

        ---

  - type: input
    id: site-name
    attributes:
      label: 站点名称
      description: 您的博客或网站名称
      placeholder: "例如: 我的博客"
    validations:
      required: true

  - type: input
    id: site-url
    attributes:
      label: 站点链接
      description: 您的网站完整 URL
      placeholder: "https://example.com"
    validations:
      required: true

  - type: input
    id: avatar-url
    attributes:
      label: 头像/图标链接
      description: 您的网站头像或图标的完整 URL
      placeholder: "https://example.com/avatar.png"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 站点描述
      description: 一句话描述您的网站
      placeholder: "分享技术与生活的个人博客"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: 标签
      description: 用逗号分隔，例如: 个人博客, 技术, 摄影
      placeholder: "个人博客, 技术"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

        ### 📌 注意事项
        - 提交申请后，我们会自动验证您的网站可访问性和友链配置
        - 审核通过后会自动创建 Pull Request 添加友链
        - 请确保已在您的网站添加本站链接: `https://your-site.com`

        ### ℹ️ 隐私说明
        您提供的信息将仅用于友链展示，不会用于其他目的。
